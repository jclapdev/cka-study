# false-secret in the style list: a kubeadm join line's CA hash is public, only its token is secret.
extends: existence
message: "'%s': only the token in a join line is secret; the CA hash is public."
level: error
ignorecase: true
tokens:
  - one secret (?:in )?each (?:way|direction)
  - two secrets in a (?:kubeadm )?join
