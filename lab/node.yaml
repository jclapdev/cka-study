# Lima template for a CKA lab node.
# user-v2 is the network mode where instances can reach each other, which a
# cluster needs. vzNAT looks right and is not: it gives each VM its own
# isolated NAT, so host-to-guest works and guest-to-guest returns "no route to
# host". socket_vmnet would also work but wants a sudo-installed helper.
vmType: vz
os: Linux
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: x86_64
networks:
  - lima: user-v2
mounts: []
containerd:
  system: false
  user: false
