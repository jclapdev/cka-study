# Prose checks for the pages the study app shows. Each rule is a habit listed in
# .claude/skills/build-exercise/references/style.md. Run: cd app && pnpm lint:prose
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = CKA
# Invisible comments such as <!-- lab: cluster -->
BlockIgnores = (?s)<!--.*?-->
CKA.Docker = NO

[[0-9][0-9]-*/[0-9][0-9]-*/README.md]
BasedOnStyles = CKA
CKA.Docker = YES
